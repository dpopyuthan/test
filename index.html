
<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रहरी सम्पर्क निर्देशिका</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px solid #0056b3;
            padding-bottom: 15px;
        }
        .header h1 {
            color: #0056b3;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            color: #666;
            font-size: 16px;
        }
        .search-box {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .search-box:focus {
            border-color: #0056b3;
        }
        .counter {
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
            text-align: right;
        }
        .contact-list {
            list-style: none;
        }
        .contact-card {
            background: #fafafa;
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .contact-card:hover {
            background: #f0f4f8;
            border-color: #0056b3;
        }
        .info .name {
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
        .info .rank {
            font-size: 14px;
            color: #0056b3;
            background: #e1ecf4;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
        }
        .call-btn {
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .call-btn:hover {
            background-color: #218838;
        }
        @media (max-width: 480px) {
            .contact-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .call-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>जिल्ला प्रहरी कार्यालय</h1>
        <p>सम्पर्क निर्देशिका (डाइरेक्ट कल सिस्टम)</p>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="दर्जा वा नाम टाइप गरी सर्च गर्नुहोस्...">
    
    <div class="counter" id="contactCounter">कुल सम्पर्क: २४१</div>

</div>
